name: Update codes
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install -r feed/requirements.txt
      - run: cd feed && python update_codes.py
      - run: cp feed/codes.json codes.json
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Auto-update promo codes"
          file_pattern: codes.json
